<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes">
<title>Attendance & Salary</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--accent2:#1e3a8a;--soft:#f8fafc;--festival:#fff7e6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:82px}
header{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:20px 16px 16px;position:sticky;top:0;z-index:5}
h1{font-size:22px;margin:0}.sub{font-size:12px;opacity:.7;margin-top:3px}
main{padding:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;margin:9px 0;box-shadow:0 2px 8px #00000008}
.month{display:flex;align-items:center;justify-content:space-between}.month b{font-size:18px}.btn{border:0;border-radius:11px;padding:9px 13px;background:#eef0f4;font-weight:700;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:var(--soft);border-radius:12px;padding:9px 3px;text-align:center}.stat b{display:block;font-size:18px}.stat small{font-size:10px;color:var(--muted)}
.money{display:flex;justify-content:space-between;padding:7px 0}.net{border-top:1px solid var(--line);margin-top:6px;padding-top:11px;font-size:21px;font-weight:800}
.row{display:grid;grid-template-columns:68px 1fr 1.15fr 112px;gap:5px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.date{font-weight:700;font-size:13px}.day{font-size:10px;color:var(--muted);font-weight:500;margin-top:2px}
select,input{width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;padding:8px 5px;background:#fff;font:inherit;font-size:12px}
.wo{background:#f1f3f5}.festival{background:var(--festival)}.fest{font-size:10px;color:#a16207;font-weight:650;margin-top:2px}
.row.att-festival{box-shadow:inset 4px 0 #d97706}.att-present{background:#ecfdf3}.row.att-half{background:#fff8db}.row.att-short{background:#eff6ff}.row.att-absent{background:#fff1f2}.row.att-holiday{background:#f5f3ff}
.row.shift-morning{box-shadow:inset 3px 0 #60a5fa}.row.shift-afternoon{box-shadow:inset 3px 0 #f59e0b}.row.shift-night{box-shadow:inset 3px 0 #8b5cf6}.row.shift-general{box-shadow:inset 3px 0 #10b981}.row.special-day{background:#fff0d6;border:1px solid #f59e0b;border-left-width:4px}.special-label{font-size:9px;color:#b45309;font-weight:800;margin-top:2px}.duty{background:#fffaf0!important}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;background:#d1d5db}.att-festival{box-shadow:inset 4px 0 #d97706}.att-present .status-dot{background:#16a34a}.att-half .status-dot{background:#eab308}.att-short .status-dot{background:#2563eb}.att-absent .status-dot{background:#dc2626}.att-holiday .status-dot{background:#7c3aed}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding:8px;gap:6px}.nav button{flex:1;max-width:240px;border:0;background:transparent;border-radius:12px;padding:11px;font-weight:700}.nav .active{background:var(--accent);color:#fff}
.hidden{display:none}.wide{width:100%}
@media(max-width:430px){.row{grid-template-columns:57px 1fr 1.1fr 104px}.row select,.row input{font-size:11px;padding:7px 3px}.stats{grid-template-columns:repeat(2,1fr)}}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.report-grid .btn{width:100%}.report-title{font-size:18px;font-weight:800}.report-muted{font-size:11px;color:var(--muted)}
@media print{.nav,header,button,.month{display:none!important}.app{max-width:none;padding:0}.card{box-shadow:none;border:0;margin:0 0 8px}.report-only{display:block!important}}
</style>
</head>
<body>
<div class="app">
<header><h1>Attendance & Salary</h1><div class="sub" id="profileName">Offline mobile tracker • Simple Festival Mode</div><button id="installBtn" class="btn" style="display:none;margin-top:9px;background:#fff;color:#111827">📲 Install App</button></header>
<main id="root"></main>
<nav class="nav"><button id="n0" class="active">🏠 Home</button><button id="n1">📅 Attendance</button><button id="n2">💰 Salary</button><button id="n3">⚙️ Settings</button></nav>
</div>
<script>
const appStorage = window.AndroidStorage ? {
  getItem: key => window.AndroidStorage.getItem(key),
  setItem: (key, value) => window.AndroidStorage.setItem(key, String(value)),
  removeItem: key => window.AndroidStorage.removeItem(key),
  clear: () => window.AndroidStorage.clear()
} : window.localStorage;
const months=["September 2026","October 2026","November 2026","December 2026","January 2027","February 2027","March 2027","April 2027","May 2027","June 2027","July 2027","August 2027","September 2027","October 2027","November 2027","December 2027"];
const festivals={
"September 2026":{1:"Nag Pancham",2:"Randhan Chhath",3:"Shitala Satam",4:"Janmashtami",14:"Ganesh Chaturthi",15:"Rishi Panchami",19:"Radha Ashtami",25:"Anant Chaturdashi / Ganesh Visarjan",26:"Bhadarvi Poonam"},
"October 2026":{2:"Gandhi Jayanti",11:"Navratri Begins",19:"Durga Ashtami / Maha Navami",20:"Dussehra / Vijayadashami",25:"Sharad Purnima"},
"November 2026":{5:"Vagh Baras",6:"Dhanteras",7:"Kali Chaudas",8:"Diwali / Lakshmi Pujan",9:"Govardhan Puja / Annakut",10:"Bestu Varas / Gujarati New Year",11:"Bhai Beej",14:"Labh Pancham",16:"Jalaram Jayanti",24:"Dev Diwali / Kartik Purnima + Guru Nanak Jayanti"},
"December 2026":{20:"Gita Jayanti",23:"Dattatreya Jayanti",25:"Christmas"},
"January 2027":{1:"New Year",15:"Makar Sankranti / Uttarayan",26:"Republic Day"},
"February 2027":{11:"Vasant Panchami"},
"March 2027":{6:"Maha Shivratri",21:"Holi",22:"Dhuleti"},
"April 2027":{7:"Gudi Padwa / Chaitra Navratri",14:"Ambedkar Jayanti",15:"Ram Navami",18:"Mahavir Jayanti"},
"May 2027":{9:"Akha Trij / Akshaya Tritiya",17:"Bakrid / Eid al-Adha",20:"Buddha Purnima"},
"June 2027":{14:"Nirjala Ekadashi / Bhim Agiyaras",16:"Muharram / Ashura"},
"July 2027":{5:"Jagannath Rath Yatra",14:"Devshayani Ekadashi",18:"Guru Purnima"},
"August 2027":{6:"Nag Panchami",17:"Raksha Bandhan",23:"Randhan Chhath",24:"Shitala Satam",25:"Janmashtami"},
"September 2027":{4:"Ganesh Chaturthi / Ganeshotsav",5:"Rishi Panchami",14:"Anant Chaturdashi / Ganesh Visarjan",15:"Bhadarvi Poonam / Ambaji Fair",30:"Sharad Navratri Begins"},
"October 2027":{2:"Gandhi Jayanti",9:"Dussehra / Vijayadashami",14:"Sharad Purnima",26:"Vagh Baras",27:"Dhanteras",28:"Kali Chaudas / Naraka Chaturdashi",29:"Diwali / Lakshmi Pujan",30:"Govardhan Puja / Bestu Varas / Gujarati New Year",31:"Bhai Beej"},
"November 2027":{3:"Labh Pancham",5:"Jalaram Jayanti",10:"Dev Uthani Ekadashi",11:"Tulsi Vivah",14:"Dev Diwali / Kartik Purnima"},
"December 2027":{9:"Gita Jayanti / Mokshada Ekadashi",13:"Dattatreya Jayanti",25:"Christmas"}};
const specialPaidDays={"January 2027":26,"August 2027":15};
function isSpecialPaidDay(d){return (months[mi]==="January 2027"&&d===26)||(months[mi]==="August 2027"&&d===15)}
function festivalDutyHours(d){return parseFloat(get(d).festivalHours)||0}
function festivalDutyMode(d){return get(d).att==='Festival Day'?"Yes":""}
function specialDutyHours(d){return parseFloat(get(d).festivalHours)||0}
function specialDutyPay(){let x=0;for(let d=1;d<=days();d++)if(isSpecialPaidDay(d)&&get(d).att==="Festival Day")x+=specialDutyHours(d)*125;return x}
function specialHoursTotal(){let x=0;for(let d=1;d<=days();d++)if(isSpecialPaidDay(d)&&get(d).att==="Festival Day")x+=specialDutyHours(d);return x}
function festivalDutyPay(){let x=0;for(let d=1;d<=days();d++)if(!isSpecialPaidDay(d)&&festivalDutyMode(d)==="Yes")x+=festivalDutyHours(d)*125;return x}
function festivalRegularBase(){return 0}
function festivalHoursTotal(){let x=0;for(let d=1;d<=days();d++)if(!isSpecialPaidDay(d)&&festivalDutyMode(d)==="Yes")x+=festivalDutyHours(d);return x}
function specialBase(){let x=0;for(let d=1;d<=days();d++)if(isSpecialPaidDay(d))x+=rate();return x}

let mi=0,screen=0;
function safeJson(raw,fallback){try{return raw==null||raw===""?fallback:JSON.parse(raw)}catch(e){return fallback}}
const defaultProfiles=[{id:"p1",name:"My Profile",rate:512.5,otRate:35,pf:.12,esic:.0075}];
let profiles=safeJson(appStorage.getItem("attendance_salary_profiles"),null);
if(!Array.isArray(profiles)||!profiles.length) profiles=defaultProfiles;
let activeProfile=appStorage.getItem("attendance_salary_active_profile")||profiles[0].id;
if(!profiles.some(p=>p.id===activeProfile)) activeProfile=profiles[0].id;
let data=safeJson(appStorage.getItem("attendance_salary_data_v4"),{});
function settings(){return profiles.find(p=>p.id===activeProfile)||profiles[0]}
function saveProfiles(){appStorage.setItem("attendance_salary_profiles",JSON.stringify(profiles));appStorage.setItem("attendance_salary_active_profile",activeProfile)}

const rate=()=>Number(settings().rate)||512.5;
const otRate=()=>Number(settings().otRate)||35;
function otPayForDay(d){
  const h=parseFloat(get(d).ot)||0;
  if(h<=0) return 0;
  // Weekly Off: no OT hour limit; every OT hour is paid at Daily Salary ÷ 8.
  if(isWeekOff(d)) return h*(rate()/8);
  // Normal working day: under 8h = configured OT rate; 8h or more = Daily Salary ÷ 8 per hour.
  return h < 8 ? h*otRate() : h*(rate()/8);
}
function totalOtPay(){let x=0;for(let d=1;d<=days();d++)x+=otPayForDay(d);return x;}
function ym(){let p=months[mi].split(" ");return [+p[1],new Date(p[0]+" 1, "+p[1]).getMonth()]}
function days(){let [y,m]=ym();return new Date(y,m+1,0).getDate()}
function defaultWeeklyOffDayForMonth(monthIndex){return monthIndex>=8?6:monthIndex>=4?0:1}
function weeklyOffDay(monthIndex=mi){const s=settings(),cfg=s.weeklyOffByMonth||{};const raw=Object.prototype.hasOwnProperty.call(cfg,String(monthIndex))?cfg[String(monthIndex)]:s.weeklyOffDay;return raw===undefined||raw===null||raw===""||raw==="auto"?null:Number(raw)}
function wo(d){let [y,m]=ym(),w=new Date(y,m,d).getDay(),override=weeklyOffDay(mi);if(override!==null)return w===override;return m>=8?w===6:m>=4?w===0:w===1}
function weeklyOffLabel(monthIndex=mi){const v=weeklyOffDay(monthIndex);return v===null?"Auto (current default)": ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][v]}
function setWeeklyOff(v,monthIndex=mi){const s=settings();s.weeklyOffByMonth=s.weeklyOffByMonth||{};if(v==="auto")delete s.weeklyOffByMonth[String(monthIndex)];else s.weeklyOffByMonth[String(monthIndex)]=Number(v);saveProfiles();render()}
function manualWeekOff(d){const r=data[dataKey(d)];return !!r&&r.att==="Weekly Off"&&!wo(d)}
function isWeekOff(d){return (wo(d)||manualWeekOff(d))&&!isSpecialPaidDay(d)}
function dataKey(d){return activeProfile+"_"+mi+"_"+d} function get(d){
  const r=data[dataKey(d)]||{shift:"",att:wo(d)?"Weekly Off":"",ot:"",festivalHours:"",shortLeaveHours:""};
  // Company rule: Short Leave up to 2 hours is unpaid by the exact hours;
  // more than 2 hours is automatically treated as Half Day.
  const slh=parseFloat(r.shortLeaveHours)||0;
  if(r.att==="Short Leave"&&slh>2) return {...r,att:"Half Day"};
  return r;
}
function shortLeaveHours(d){return parseFloat(get(d).shortLeaveHours)||0}
function shortLeaveDeductionForDay(d){
  const h=shortLeaveHours(d);
  return h>0&&h<=2 ? (rate()/8)*h : 0;
}
function totalShortLeaveHours(){let x=0;for(let d=1;d<=days();d++)x+=shortLeaveHours(d);return x}
function totalShortLeaveDeduction(){let x=0;for(let d=1;d<=days();d++)x+=shortLeaveDeductionForDay(d);return x}
function set(d,k,v){let r=get(d);r[k]=v;if(isWeekOff(d))r.att="Weekly Off";data[dataKey(d)]=r;appStorage.setItem("attendance_salary_data_v4",JSON.stringify(data))}
function clearManualWeekOff(d){const r=get(d);r.att=wo(d)?"Weekly Off":"";data[dataKey(d)]=r;appStorage.setItem("attendance_salary_data_v4",JSON.stringify(data));render()}
function attChange(d,v){if(v==="__clear_weekoff"){clearManualWeekOff(d);return}upd(d,"att",v)}
function count(v){let n=0;for(let d=1;d<=days();d++)if(get(d).att===v)n++;return n}
function ot(){let x=0;for(let d=1;d<=days();d++)x+=parseFloat(get(d).ot)||0;return x}
function basic(){
  let x=0;
  for(let d=1;d<=days();d++){
    const a=get(d).att;
    if(a==="Present") x+=rate();
    else if(a==="Half Day") x+=rate()*.5;
    else if(a==="Short Leave") x+=rate()-shortLeaveDeductionForDay(d);
  }
  return x+specialBase()+festivalRegularBase();
}
function gross(){return basic()+totalOtPay()+specialDutyPay()+festivalDutyPay()}
function net(){return gross()-Math.round(basic()*Number(settings().pf))-Math.round(basic()*Number(settings().esic))}
function monthbar(){return `<div class="card"><div class="month"><button class="btn" onclick="chg(-1)">‹</button><b>${months[mi]}</b><button class="btn" onclick="chg(1)">›</button></div></div>`}
function festivalList(){
  const f=festivals[months[mi]]||{};
  const items=Object.entries(f);
  if(!items.length) return '<div class="note">No festival/holiday listed for this month.</div>';
  return items.map(([d,n])=>`<div class="money"><span>${String(d).padStart(2,"0")} — ${n}${isSpecialPaidDay(Number(d))?" 🇮🇳 Paid + ₹125/h duty":""}</span><b>🎉</b></div>`).join("");
}
function home(){let p=count("Present"),a=count("Absent"),w=Array.from({length:days()},(_,i)=>isWeekOff(i+1)).filter(Boolean).length;return monthbar()+`<div class="card"><div class="stats"><div class="stat"><b>${p}</b><small>Present</small></div><div class="stat"><b>${a}</b><small>Absent</small></div><div class="stat"><b>${w}</b><small>Week Off</small></div><div class="stat"><b>${ot().toFixed(1)}</b><small>OT Hours</small></div></div></div><div class="card"><div class="money"><span>Basic Earned</span><b>₹${basic().toFixed(2)}</b></div><div class="money"><span>OT</span><b>₹${totalOtPay().toFixed(2)}</b></div><div class="money"><span>🇮🇳 Special Duty (₹125/h)</span><b>₹${specialDutyPay().toFixed(2)}</b></div><div class="money"><span>🎉 Festival Duty ₹125/h</span><b>₹${festivalDutyPay().toFixed(2)}</b></div><div class="money"><span>PF ${Number(settings().pf)*100}%</span><b>−₹${Math.round(basic()*Number(settings().pf))}</b></div><div class="money"><span>ESIC ${Number(settings().esic)*100}%</span><b>−₹${Math.round(basic()*Number(settings().esic))}</b></div><div class="money net"><span>Net Estimate</span><b>₹${net().toFixed(2)}</b></div></div><div class="card"><h3 style="margin:2px 0 8px">🎉 Festivals & Holidays</h3>${festivalList()}</div><div class="card"><button class="btn wide" onclick="go(1)">📅 Open Attendance</button></div>`}
function attendance(){
  let s=monthbar()+`<div class="card"><div class="money"><span><b>📅 Weekly Off Day</b><small style="display:block;color:#6b7280">Default ko same rakhna ho to Auto select karo</small></span><select style="width:190px" onchange="setWeeklyOff(this.value)"><option value="auto" ${weeklyOffDay()===null?'selected':''}>Auto (Default)</option>${["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"].map((x,i)=>`<option value="${i}" ${weeklyOffDay()===i?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="card">';
  for(let d=1;d<=days();d++){
    const r=get(d), dt=new Date(ym()[0],ym()[1],d);
    const day=dt.toLocaleDateString('en-IN',{weekday:'short'});
    const f=(festivals[months[mi]]||{})[d]||'';
    const special=isSpecialPaidDay(d), eligible=!!f||special;
    const attClass={Present:'att-present','Half Day':'att-half','Short Leave':'att-short',Absent:'att-absent',Holiday:'att-holiday','Festival Day':'att-festival'}[r.att]||'';
    const shiftClass={Morning:'shift-morning',Afternoon:'shift-afternoon',Night:'shift-night',General:'shift-general'}[r.shift]||'';
    const cl=special?'special-day':isWeekOff(d)?'wo':f?'festival':'';
    const manualOff=manualWeekOff(d);
    let opts;
    if(isWeekOff(d)){
      opts='<option value="Weekly Off" selected>Weekly Off</option>';
      if(manualOff) opts+='<option value="__clear_weekoff">Remove Weekly Off</option>';
    }else{
      const choices=eligible?['Present','Half Day','Short Leave','Absent','Holiday','Festival Day','Weekly Off']:['Present','Half Day','Short Leave','Absent','Holiday','Weekly Off'];
      opts='<option value="">Attendance</option>'+choices.map(x=>'<option value="'+x+'" '+(r.att===x?'selected':'')+'>'+x+'</option>').join('');
    }
    let extra='';
    if(r.att==='Festival Day'){
      extra='<input class="duty" type="number" min="0" step=".5" value="'+(r.festivalHours||'')+'" placeholder="Festival h" onchange="upd('+d+',\'festivalHours\',this.value)">';
    }else if(r.att==='Short Leave'){
      extra='<div style="display:flex;gap:4px;width:100%"><input style="width:50%" type="number" min="0" max="2" step=".5" value="'+(r.shortLeaveHours||'')+'" placeholder="SL h" oninput="shortLeaveInput('+d+',this.value)"><input style="width:50%" type="number" min="0" step=".5" value="'+(r.ot||'')+'" placeholder="OT" onchange="upd('+d+',\'ot\',this.value)"></div>';
    }else{
      extra='<input type="number" min="0" step=".5" value="'+(r.ot||'')+'" placeholder="OT" onchange="upd('+d+',\'ot\',this.value)">';
    }
    const festLabel=special?'<div class="special-label">🇮🇳 PAID DAY</div>':f?'<div class="fest">'+f+'</div>':'';
    s+='<div class="row '+cl+' '+attClass+' '+shiftClass+'"><div class="date">'+String(d).padStart(2,'0')+'<div class="day">'+day+'</div>'+festLabel+'</div>'+'<select onchange="upd('+d+',\'shift\',this.value)"><option value="">Shift</option>'+['Morning','Afternoon','Night','General'].map(x=>'<option '+(r.shift===x?'selected':'')+'>'+x+'</option>').join('')+'</select>'+'<select onchange="attChange('+d+',this.value)">'+opts+'</select>'+extra+'</div>';
  }
  return s+'</div><div class="card note">⏱️ Short Leave: 2 hours tak exact hours ka deduction hoga (Daily Salary ÷ 8 × Short Leave Hours). 2 hours se zyada enter karte hi automatically Half Day ho jayega. Short Leave wale din bhi OT alag se bhar sakte ho. OT aur SL dono calculate honge.<br>🎉 <b>Festival Day</b> option ab kisi bhi date par manually select kar sakte ho — chahe festival list me date na ho. Hours भरो → <b>₹125/hour extra</b>, aur salary calculation me automatically include hoga. Agar Festival Day select nahi karte aur <b>Present</b> select karte ho, to normal working-day rule lagega. 🇮🇳 15 August & 26 January par daily salary aaye ya na aaye milegi; Festival Day select karke duty hours bharne par ₹125/hour extra milega. Dono days PF/ESIC count mein include honge. Weekly Off: Auto par existing default 2026–2027 rule rahega (Sep–Dec Saturday • Jan–Apr Monday • May–Aug Sunday). Agar Monday/Sunday/Saturday etc. select karoge to selected day har month ka regular Weekly Off ban jayega, aur purana default day normal working day ho jayega. Extra Weekly Off kisi bhi date ke Attendance dropdown se manually set kar sakte ho. 15 August & 26 January are company-paid special days even if they fall on a weekly off.</div>';
}
function monthlyReport(){
  const s=settings(), present=count("Present"), half=count("Half Day"), absent=count("Absent"), weekly=Array.from({length:days()},(_,i)=>isWeekOff(i+1)).filter(Boolean).length;
  const otH=ot(), otP=totalOtPay(), spH=specialHoursTotal(), spP=specialDutyPay(), fdH=festivalHoursTotal(), fdP=festivalDutyPay(), b=basic(), pf=Math.round(b*Number(s.pf)), esic=Math.round(b*Number(s.esic)), g=gross(), n=net();
  return `<div class="card report-only"><div class="report-title">📊 ${months[mi]} Salary Report</div><div class="report-muted">Profile: ${s.name} • Daily Salary: ₹${Number(s.rate).toFixed(2)}</div><div class="money"><span>Present</span><b>${present} days</b></div><div class="money"><span>Half Day</span><b>${half}</b></div><div class="money"><span>Absent</span><b>${absent}</b></div><div class="money"><span>Weekly Off</span><b>${weekly}</b></div><div class="money"><span>Basic Earned</span><b>₹${b.toFixed(2)}</b></div><div class="money"><span>Short Leave (${totalShortLeaveHours().toFixed(1)}h) <small style="color:#6b7280">(deduction included)</small></span><b>−₹${totalShortLeaveDeduction().toFixed(2)}</b></div><div class="money"><span>Normal OT (${otH.toFixed(1)}h)</span><b>₹${otP.toFixed(2)}</b></div><div class="money"><span>🇮🇳 Special Days (${spH.toFixed(1)}h duty)</span><b>₹${spP.toFixed(2)}</b></div><div class="money"><span>🎉 Festival Duty (${fdH.toFixed(1)}h)</span><b>₹${fdP.toFixed(2)}</b></div><div class="money"><span>Gross</span><b>₹${g.toFixed(2)}</b></div><div class="money"><span>PF ${Number(s.pf)*100}%</span><b>−₹${pf}</b></div><div class="money"><span>ESIC ${Number(s.esic)*100}%</span><b>−₹${esic}</b></div><div class="money net"><span>NET SALARY</span><b>₹${n.toFixed(2)}</b></div></div>`;
}
function printReport(){
  const old=document.getElementById("root").innerHTML;
  document.getElementById("root").innerHTML=monthlyReport();
  window.print();
  document.getElementById("root").innerHTML=old;
}
function exportCSV(){

function dailySalaryBreakdown(){
  let rows='<div class="card"><h3 style="margin:2px 0 10px">📅 Daily Salary Breakdown</h3>';
  let total=0;
  for(let d=1;d<=days();d++){
    const r=get(d), a=r.att, sl=shortLeaveDeductionForDay(d), op=otPayForDay(d);
    let base=0;
    if(a==="Present") base=rate();
    else if(a==="Half Day") base=rate()*.5;
    else if(a==="Short Leave") base=rate()-sl;
    else if(isSpecialPaidDay(d)) base=rate();
    const duty=(isSpecialPaidDay(d)&&a==="Festival Day"?specialDutyHours(d)*125:(!isSpecialPaidDay(d)&&a==="Festival Day"?festivalDutyHours(d)*125:0));
    const dayTotal=base+op+duty;
    if(a||r.ot||r.shortLeaveHours||r.festivalHours){
      total+=dayTotal;
      rows+=`<div class="money"><span><b>${String(d).padStart(2,'0')}</b> — ${a||"—"}<small style="display:block;color:#6b7280">${r.shift||"No shift"}${sl>0?" • SL −₹"+sl.toFixed(2):""}${op>0?" • OT +₹"+op.toFixed(2):""}</small></span><b>₹${dayTotal.toFixed(2)}</b></div>`;
    }
  }
  rows+=`<div class="money net"><span>Daily Total Shown</span><b>₹${total.toFixed(2)}</b></div></div>`;
  return rows;
}

function backupData(){
  const payload={version:"V15",exportedAt:new Date().toISOString(),profiles,activeProfile,data};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="AttendanceSalary_Backup_"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function shareData(){
  const payload={version:1,app:"Attendance & Salary",exportedAt:new Date().toISOString(),profiles,activeProfile,data};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const file=new File([blob],"AttendanceSalary_Shared_Data.json",{type:"application/json"});
  try{
    if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
      await navigator.share({title:"Attendance & Salary Data",text:"Attendance & Salary backup — import this file in the app using Restore Data.",files:[file]});
      return;
    }
  }catch(e){if(e&&e.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="AttendanceSalary_Shared_Data.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  alert("Share option phone par available nahi tha, isliye shareable backup file download kar di hai. Is file ko WhatsApp/Drive etc. par bhej sakte ho.");
}
function shareSummary(){
  const p=count("Present"),h=count("Half Day"),a=count("Absent"),w=Array.from({length:days()},(_,i)=>isWeekOff(i+1)).filter(Boolean).length;
  const txt=`Attendance & Salary — ${months[mi]}\nProfile: ${settings().name}\nPresent: ${p} days\nHalf Day: ${h}\nAbsent: ${a}\nWeekly Off: ${w}\nOT: ${ot().toFixed(1)} h / ₹${totalOtPay().toFixed(2)}\nFestival Duty: ${festivalHoursTotal().toFixed(1)} h / ₹${festivalDutyPay().toFixed(2)}\nBasic: ₹${basic().toFixed(2)}\nPF: ₹${Math.round(basic()*Number(settings().pf))}\nESIC: ₹${Math.round(basic()*Number(settings().esic))}\nNet Salary: ₹${net().toFixed(2)}`;
  if(navigator.share){navigator.share({title:`Salary Summary — ${months[mi]}`,text:txt}).catch(e=>{});}else{navigator.clipboard?.writeText(txt);alert("Summary copy kar diya gaya hai. Ab WhatsApp/any app mein paste karke share kar sakte ho.");}
}
function restoreData(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const x=JSON.parse(reader.result);
      if(!Array.isArray(x.profiles)||!x.profiles.length||typeof x.data!=="object")throw new Error("Invalid backup");
      profiles=x.profiles;
      activeProfile=x.activeProfile||profiles[0].id;
      if(!profiles.some(p=>p.id===activeProfile))activeProfile=profiles[0].id;
      data=x.data||{};
      saveProfiles();
      appStorage.setItem("attendance_salary_data_v4",JSON.stringify(data));
      alert("Backup restored successfully ✓");
      render();
    }catch(e){alert("Backup file valid nahi hai.");}
  };
  reader.readAsText(file);
}

saveProfiles();render();

activeProfile=id;appStorage.setItem("attendance_salary_active_profile",id);render();

function addProfile(){
const name=prompt("Friend/Profile name?");
if(!name) return;
const id="p"+Date.now();
profiles.push({id,name:name.trim(),rate:512.5,otRate:35,pf:.12,esic:.0075});
activeProfile=id;saveProfiles();render();
}
function shortLeaveInput(d,v){
  const h=parseFloat(v)||0;
  set(d,'shortLeaveHours',v);
  if(h>2){
    set(d,'att','Half Day');
    render();
  }
}
function upd(d,k,v){
  if(k==='att'){
    if(v==='Festival Day'){
      set(d,'ot','');
      set(d,'shortLeaveHours','');
    }else{
      set(d,'festivalHours','');
      if(v!=='Short Leave') set(d,'shortLeaveHours','');
    }
  }
  if(k==='shortLeaveHours'){
    const h=parseFloat(v)||0;
    if(h>2){
      set(d,'shortLeaveHours',v);
      set(d,'att','Half Day');
    }else{
      set(d,'shortLeaveHours',v);
      set(d,'att','Short Leave');
    }
  }
  set(d,k,v);
  render();
}
function chg(n){mi=Math.max(0,Math.min(months.length-1,mi+n));render()}
function go(s){screen=s;render()}
function render(){try{document.getElementById("root").innerHTML=screen===0?home():screen===1?attendance():screen===2?salary():settingsScreen();document.getElementById("profileName").textContent="Offline mobile tracker • "+settings().name;[0,1,2,3].forEach(i=>document.getElementById("n"+i).classList.toggle("active",i===screen))}catch(e){console.error("Attendance & Salary render error:",e);document.getElementById("root").innerHTML='<div class="card"><h3>⚠️ App data error</h3><div class="note">App data read karte waqt problem aayi. Settings se Backup/Restore use karke data recover kiya ja sakta hai.</div><button class="btn wide" style="margin-top:10px" onclick="location.reload()">🔄 Reload App</button></div>’}}
n0.onclick=()=>go(0);n1.onclick=()=>go(1);n2.onclick=()=>go(2);n3.onclick=()=>go(3);render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

let deferredInstall=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;const b=document.getElementById("installBtn");if(b)b.style.display="inline-block";});
document.addEventListener("click",async e=>{if(e.target&&e.target.id==="installBtn"&&deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;e.target.style.display="none";}});
window.addEventListener("appinstalled",()=>{const b=document.getElementById("installBtn");if(b)b.style.display="none";});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
</script>
